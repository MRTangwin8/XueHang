# 构建并发布 Docker 镜像到 GitHub Container Registry（ghcr.io）
#
#   推送到 main         → ghcr.io/<owner>/xuehang:latest、:main、:sha-xxxxxxx
#   推送标签 v1.2.3      → ghcr.io/<owner>/xuehang:1.2.3、:1.2、:latest
#   配置了 Docker Hub 时，同样的标签也会推送到 docker.io/<DockerHub 用户名>/xuehang
#
# 已部署的站点只需拉取新镜像并重建容器即可升级（见 docs/部署指南.md「升级到新版本」）。
# 第一次发布后，请到 GitHub 个人主页 → Packages → xuehang → Package settings，把可见性改为 Public，
# 这样服务器无需登录即可拉取。

name: docker

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    env:
      # 可选：同步发布到 Docker Hub（国内服务器更容易拉取）。在仓库 Settings → Secrets and variables → Actions 中添加：
      #   Variables: DOCKERHUB_USERNAME = 你的 Docker Hub 用户名
      #   Secrets:   DOCKERHUB_TOKEN    = Docker Hub 的访问令牌（Read & Write）
      # 两项都没配置时只发布到 ghcr.io。
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: 镜像名（仓库名转小写）
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/xuehang" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录 Docker Hub（已配置时）
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ steps.name.outputs.image }}
            name=docker.io/${{ env.DOCKERHUB_USERNAME }}/xuehang,enable=${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # 发布的镜像预装 MySQL / MariaDB 驱动，服务器不需要联网安装
          build-args: WITH_MYSQL=1
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
