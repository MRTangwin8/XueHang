# 学航 · 教学管理平台 —— Docker Compose
#
#   最简单的启动方式：./deploy.sh        （见 docs/部署指南.md）
#   或手动：          docker compose up -d --build
#
# 数据（配置、SQLite 数据库、上传文件）保存在当前目录的 ./data，备份这个目录即可。
# 本文件不包含数据库服务：默认使用 SQLite；需要 MySQL / PostgreSQL 时，在安装向导里填写已有数据库的地址。

services:
  app:
    build:
      context: .
      args:
        WITH_MYSQL: ${WITH_MYSQL:-0}
    image: xuehang:latest
    container_name: xuehang
    restart: unless-stopped
    init: true
    environment:
      # 在反向代理后面时为 1（取得真实客户端 IP）；直接对外开放端口时必须为 0
      TRUST_PROXY: ${TRUST_PROXY:-1}
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # 默认只监听本机 8080，由前面的反向代理（Nginx / IIS / Caddy）对外提供 HTTPS；BIND=0.0.0.0 才直接对外
      - "${BIND:-127.0.0.1}:${PORT:-8080}:3001"
    volumes:
      - ./data:/data

  # 可选：自动申请 HTTPS 证书的反向代理。需要一个已解析到本机的域名，并放行 80 / 443 端口。
  #   DOMAIN=crm.example.com ./deploy.sh
  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:-localhost} --to app:3001
    volumes:
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
